<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U.M.S SASAULI URDU - Marks Details</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#182233}
.app{max-width:1280px;margin:auto;padding:16px}
header{background:#173b63;color:#fff;border-radius:14px;padding:18px;margin-bottom:16px}
header h1{margin:0;font-size:24px}header p{margin:5px 0 0;opacity:.88}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #00000012}
h2{font-size:19px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
button{border:0;border-radius:8px;padding:10px 14px;background:#173b63;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#64748b}button.danger{background:#b42318}button.green{background:#16794c}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.small{font-size:12px;color:#64748b}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.subject-item{border:1px solid #d8e0e8;border-radius:9px;padding:10px}
.subject-item input{width:auto;margin-right:7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f5f8fc;border-radius:10px;padding:12px}.stat span{display:block;color:#64748b;font-size:12px}.stat b{font-size:22px;color:#173b63}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #cbd5e1;padding:7px;text-align:center}
th{background:#e9eff6}td.name{text-align:left;white-space:nowrap}
.badge{display:inline-block;border-radius:15px;padding:3px 8px;background:#e9eff6;font-weight:700}
#toast{display:none;position:fixed;right:15px;bottom:15px;background:#182233;color:#fff;padding:11px 15px;border-radius:9px;z-index:100}
.print-area{display:none}

/* Printable class-specific folio */
.folio-page{width:190mm;min-height:277mm;margin:0 auto;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.folio-header{text-align:center;line-height:1.25}
.folio-header .school{font-size:17px;font-weight:700;text-transform:uppercase}
.folio-header .location{font-size:10px;margin-top:2px}
.folio-header .exam{font-size:12px;font-weight:700;margin-top:4px}
.folio-header .session{font-size:11px;font-weight:700}
.folio-header .title{font-size:15px;font-weight:700;text-decoration:underline;margin-top:3px}
.folio-meta{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;margin:10px 0 8px;font-size:9.5px}
.folio-meta div{border-bottom:1px dotted #555;padding:3px 0;min-height:16px}
.folio-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.2px}
.folio-table th,.folio-table td{border:1px solid #222;padding:3px 2px;text-align:center;vertical-align:middle;height:18px}
.folio-table th{font-weight:700;background:#f7f7f7}
.folio-table th.sl{width:6%}.folio-table th.roll{width:7%}.folio-table th.name{width:28%}
.folio-table th.sub{width:auto}.folio-table th.total{width:8%}.folio-table th.grade{width:12%}
.folio-table td.name{text-align:left;padding-left:4px}
.folio-note{font-size:8px;margin-top:5px}
.folio-sign{display:flex;justify-content:space-between;margin-top:28px;font-size:9px}
.page-number{text-align:right;font-size:8px;margin-top:5px}
@media print{
 @page{size:A4 portrait;margin:10mm}
 body{background:#fff}.no-print{display:none!important}.print-area{display:block!important}
 .folio-page{width:auto;min-height:0;margin:0;page-break-after:always}
 .folio-page:last-child{page-break-after:auto}
}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app no-print">
<header>
<h1>U.M.S SASAULI URDU</h1>
<p>Student Marks Management & Printable Marks Details</p>
</header>

<section class="card">
<h2>School & Examination Details</h2>
<div class="grid">
<div><label>School Name</label><input id="school" value="U.M.S SASAULI URDU"></div>
<div><label>District</label><input id="district" value="Muzaffarpur"></div>
<div><label>Block</label><input id="block" value="Aurai"></div>
<div><label>Academic Session</label><input id="session" value="2026-27"></div>
<div><label>Examination</label><input id="exam" value="Half Yearly Examination"></div>
<div><label>Marks Folio Heading</label><input id="folioTitle" value="STUDENT MARKS DETAILS"></div>
<div><label>Class</label><select id="classSel" onchange="classChanged()"></select></div>
<div><label>Section</label><input id="section" placeholder="A"></div>
<div><label>Full Marks per Subject</label><input id="fullMarks" type="number" min="1" value="50" onchange="renderMarkInputs();renderList()"></div>
</div>
</section>

<section class="card">
<h2>Class Subject Setup</h2>
<div id="subjectSettings" class="subject-grid"></div>
<div class="actions">
<button onclick="saveSubjects()">Save Subjects</button>
<button class="secondary" onclick="resetCurrentSubjects()">Reset This Class</button>
</div>
</section>

<section class="card">
<h2>Add / Edit Student</h2>
<div class="grid">
<div><label>Roll Number</label><input id="roll" type="number" min="1"></div>
<div><label>Student Name</label><input id="studentName"></div>
</div>
<div id="markInputs" class="grid" style="margin-top:12px"></div>
<div class="actions"><button onclick="saveStudent()">Save Student</button><button class="secondary" onclick="clearStudent()">Clear</button></div>
</section>

<section class="card">
<h2>Class Result</h2>
<div class="stats">
<div class="stat"><span>Students</span><b id="statCount">0</b></div>
<div class="stat"><span>Average</span><b id="statAvg">0%</b></div>
<div class="stat"><span>Passed</span><b id="statPass">0</b></div>
<div class="stat"><span>Failed</span><b id="statFail">0</b></div>
</div>
</section>

<section class="card">
<h2>Student List</h2>
<div class="grid"><div><label>Search</label><input id="search" placeholder="Search by name or roll" oninput="renderList()"></div></div>
<div class="actions">
<button onclick="printFolio()">Print Class Marks Details</button>
<button class="green" onclick="exportCSV()">Export CSV</button>
</div>
<div class="table-wrap"><table><thead id="listHead"></thead><tbody id="listBody"></tbody></table></div>
</section>
</div>

<div id="printArea" class="print-area"></div>
<div id="toast"></div>

<script>
const DEFAULTS={
"1":["Urdu","English","Mathematics"],
"2":["Urdu","English","Mathematics"],
"3":["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Environmental Science"],
"4":["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Environmental Science"],
"5":["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Environmental Science"],
"6":["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Science","Social Science"],
"7":["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Science","Social Science"],
"8":["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Science","Social Science"]
};
const ALL_SUBJECTS=["Urdu","English","Hindi/Rashtrabhasa","Mathematics","Environmental Science","Science","Social Science"];
let settings=JSON.parse(localStorage.getItem("folio_subjects_v4")||"null")||structuredClone(DEFAULTS);
let students=JSON.parse(localStorage.getItem("folio_students_v4")||"[]");
let editingId=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function cls(){return $("classSel").value}
function sec(){return $("section").value.trim()}
function subs(){return settings[cls()]||[]}
function meta(){return {school:$("school").value,district:$("district").value,block:$("block").value,session:$("session").value,exam:$("exam").value,folioTitle:$("folioTitle").value,section:$("section").value,fullMarks:Number($("fullMarks").value)||50}}
function saveMeta(){localStorage.setItem("folio_meta_v4",JSON.stringify(meta()))}
function loadMeta(){let m=JSON.parse(localStorage.getItem("folio_meta_v4")||"{}");Object.keys(m).forEach(k=>{if($(k))$(k).value=m[k]})}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1600)}
function init(){$("classSel").innerHTML=Object.keys(DEFAULTS).map(c=>`<option>${c}</option>`).join("");loadMeta();renderSubjectSettings();renderMarkInputs();renderList()}
function classChanged(){clearStudent(false);renderSubjectSettings();renderMarkInputs();renderList()}
function renderSubjectSettings(){let active=settings[cls()]||[];$("subjectSettings").innerHTML=ALL_SUBJECTS.map(s=>`<label class="subject-item"><input type="checkbox" data-sub="${esc(s)}" ${active.includes(s)?"checked":""}>${esc(s)}</label>`).join("")}
function saveSubjects(){let chosen=[...document.querySelectorAll("#subjectSettings input:checked")].map(x=>x.dataset.sub);if(!chosen.length){alert("Select at least one subject.");return}settings[cls()]=chosen;localStorage.setItem("folio_subjects_v4",JSON.stringify(settings));renderMarkInputs();renderList();toast("Subjects saved")}
function resetCurrentSubjects(){settings[cls()]=[...DEFAULTS[cls()]];localStorage.setItem("folio_subjects_v4",JSON.stringify(settings));renderSubjectSettings();renderMarkInputs();renderList();toast("Default subjects restored")}
function renderMarkInputs(){let fm=Number($("fullMarks").value)||50;$("markInputs").innerHTML=subs().map((s,i)=>`<div><label>${esc(s)} (${fm})</label><input id="m${i}" type="number" min="0" max="${fm}" step="0.01"></div>`).join("")}
function clearStudent(render=true){editingId=null;$("roll").value="";$("studentName").value="";renderMarkInputs();if(render)renderList()}
function getMarks(){let fm=Number($("fullMarks").value)||50,m={};subs().forEach((s,i)=>{let v=Number($("m"+i).value||0);if(v<0||v>fm)throw Error(s+" must be between 0 and "+fm);m[s]=v});return m}
function saveStudent(){try{saveMeta();let roll=Number($("roll").value),name=$("studentName").value.trim();if(!roll||!name){alert("Enter roll number and student name.");return}let obj={id:editingId||crypto.randomUUID(),cls:cls(),section:sec(),roll,name,marks:getMarks(),fullMarks:Number($("fullMarks").value)||50};let idx=students.findIndex(x=>x.id===editingId);if(idx>=0)students[idx]=obj;else{if(students.some(x=>x.cls===obj.cls&&(x.section||"")===obj.section&&x.roll===obj.roll)){alert("That roll number already exists in this class/section.");return}students.push(obj)}students.sort((a,b)=>Number(a.cls)-Number(b.cls)||(a.section||"").localeCompare(b.section||"")||a.roll-b.roll);localStorage.setItem("folio_students_v4",JSON.stringify(students));clearStudent();toast("Student saved")}catch(e){alert(e.message)}}
function calc(x){let vals=Object.values(x.marks||{}),fm=x.fullMarks||50,total=vals.reduce((a,b)=>a+Number(b),0),max=vals.length*fm,p=max?100*total/max:0;return{total,max,pct:p,grade:p>=81?"A":p>=61?"B":p>=41?"C":p>=33?"D":"F"}}
function currentStudents(){let q=$("search").value.toLowerCase();return students.filter(x=>x.cls===cls()&&(x.section||"")===sec()&&(x.name.toLowerCase().includes(q)||String(x.roll).includes(q))).sort((a,b)=>a.roll-b.roll)}
function renderList(){let s=subs(),data=currentStudents();$("listHead").innerHTML="<tr><th>Roll</th><th>Student Name</th>"+s.map(x=>`<th>${esc(x)}</th>`).join("")+"<th>Total</th><th>%</th><th>Grade</th><th>Action</th></tr>";$("listBody").innerHTML=data.map(x=>{let c=calc(x);return `<tr><td>${x.roll}</td><td class="name">${esc(x.name)}</td>${s.map(z=>`<td>${x.marks[z]??""}</td>`).join("")}<td>${c.total}/${c.max}</td><td>${c.pct.toFixed(1)}%</td><td><span class="badge">${c.grade}</span></td><td><button onclick="editStudent('${x.id}')">Edit</button> <button class="danger" onclick="removeStudent('${x.id}')">Delete</button></td></tr>`}).join("")||`<tr><td colspan="${s.length+6}">No students found.</td></tr>`;let cs=data.map(calc),avg=cs.length?cs.reduce((a,b)=>a+b.pct,0)/cs.length:0;$("statCount").textContent=data.length;$("statAvg").textContent=avg.toFixed(1)+"%";$("statPass").textContent=cs.filter(x=>x.pct>=33).length;$("statFail").textContent=cs.filter(x=>x.pct<33).length}
function editStudent(id){let x=students.find(z=>z.id===id);if(!x)return;$("classSel").value=x.cls;$("section").value=x.section||"";$("fullMarks").value=x.fullMarks||50;renderSubjectSettings();renderMarkInputs();$("roll").value=x.roll;$("studentName").value=x.name;subs().forEach((s,i)=>$("m"+i).value=x.marks[s]??"");editingId=id;window.scrollTo({top:0,behavior:"smooth"});toast("Editing "+x.name)}
function removeStudent(id){let x=students.find(z=>z.id===id);if(x&&confirm("Delete "+x.name+" (Roll "+x.roll+")?")){students=students.filter(z=>z.id!==id);localStorage.setItem("folio_students_v4",JSON.stringify(students));renderList();toast("Student deleted")}}
function printFolio(){
saveMeta();let m=meta(),data=students.filter(x=>x.cls===cls()&&(x.section||"")===sec()).sort((a,b)=>a.roll-b.roll),s=subs(),fm=m.fullMarks;
let rowsPerPage=28,pages=[];
for(let start=0;start<data.length||start===0;start+=rowsPerPage){
let chunk=data.slice(start,start+rowsPerPage);
let rows=chunk.map((x,i)=>{let c=calc(x);return `<tr><td>${start+i+1}</td><td>${x.roll}</td><td class="name">${esc(x.name)}</td>${s.map(z=>`<td>${x.marks[z]??""}</td>`).join("")}<td>${c.total}</td><td>${c.pct.toFixed(1)}% / ${c.grade}</td></tr>`}).join("");
let th=s.map(z=>`<th class="sub">${esc(z)}<br><span style="font-weight:400">(${fm})</span></th>`).join("");
pages.push(`<div class="folio-page">
<div class="folio-header"><div class="school">${esc(m.school||"U.M.S SASAULI URDU")}</div><div class="location">District: ${esc(m.district||"Muzaffarpur")} &nbsp; | &nbsp; Block: ${esc(m.block||"Aurai")}</div><div class="exam">${esc(m.exam||"Examination")}</div><div class="session">Academic Session: ${esc(m.session||"")}</div><div class="title">${esc(m.folioTitle||"STUDENT MARKS DETAILS")}</div></div>
<div class="folio-meta">
<div><b>School:</b> ${esc(m.school)}</div><div><b>District:</b> ${esc(m.district)}</div>
<div><b>Block:</b> ${esc(m.block)}</div><div><b>Class:</b> ${esc(cls())}</div>
<div><b>Section:</b> ${esc(sec()||"-")}</div><div><b>Total Full Marks:</b> ${s.length*fm}</div>
<div><b>Examination:</b> ${esc(m.exam)}</div><div><b>Students:</b> ${data.length}</div>
</div>
<table class="folio-table"><thead><tr><th class="sl">Sl. No.</th><th class="roll">Roll No.</th><th class="name">Student Name</th>${th}<th class="total">Total</th><th class="grade">Grade / Percentage</th></tr></thead><tbody>${rows||`<tr><td colspan="${s.length+5}">No students entered.</td></tr>`}</tbody></table>
<div class="folio-note">Grade: A 81–100% &nbsp; B 61–80% &nbsp; C 41–60% &nbsp; D 33–40% &nbsp; F below 33%.</div>
<div class="folio-sign"><span>Teacher's Signature: ____________________</span><span>Head Teacher's Signature & Seal: ____________________</span></div>
<div class="page-number">Class ${esc(cls())} • Page ${Math.floor(start/rowsPerPage)+1} of ${Math.max(1,Math.ceil(data.length/rowsPerPage))}</div>
</div>`);
if(start+rowsPerPage>=data.length)break}
$("printArea").innerHTML=pages.join("");window.print()}
function exportCSV(){let s=subs(),data=students.filter(x=>x.cls===cls()&&(x.section||"")===sec()).sort((a,b)=>a.roll-b.roll),rows=[["School","District","Block","Class","Section","Roll","Student Name",...s,"Total","Percentage","Grade"]];data.forEach(x=>{let c=calc(x);rows.push([$("school").value,$("district").value,$("block").value,x.cls,x.section,x.roll,x.name,...s.map(z=>x.marks[z]??""),c.total,c.pct.toFixed(2),c.grade])});let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${$("school").value||"school"}-class-${cls()}-marks.csv`;a.click()}
init();
</script>
</body>
</html>
